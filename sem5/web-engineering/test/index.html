<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Sticky Header */
        .header {
            position: sticky;
            top: 0;
            background: #222;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .header h2 {
            margin: 0;
        }

        /* Dropdown menu */
        .nav {
            position: relative;
        }

        .nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav ul li {
            position: relative;
            cursor: pointer;
        }

        /* Drop-down content */
        .dropdown {
            display: none;
            position: absolute;
            top: 30px;
            left: 0;
            background: white;
            color: black;
            min-width: 120px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .dropdown p {
            padding: 10px;
            margin: 0;
            cursor: pointer;
        }

        .dropdown p:hover {
            background: #eee;
        }

        .nav ul li:hover .dropdown {
            display: block;
        }

        /* Product Gallery Scroll */
        .product-gallery {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .product-gallery::-webkit-scrollbar {
            height: 8px;
        }
        .product-gallery::-webkit-scrollbar-thumb {
            background: #777;
            border-radius: 4px;
        }

        /* Product Card */
        .product-card {
            width: 250px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            position: relative; /* relative positioning */
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        /* Absolute Positioned Label */
        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .label.new {
            background: green;
        }

        .product-info {
            padding: 12px;
            text-align: center;
        }

        /* Fixed Chat Support Button */
        .chat-support {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0d6efd;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h2>MyShop</h2>
        <div class="nav">
            <ul>
                <li>Home</li>
                <li>Categories
                    <div class="dropdown">
                        <p>Electronics</p>
                        <p>Fashion</p>
                        <p>Groceries</p>
                    </div>
                </li>
                <li>Contact</li>
            </ul>
        </div>
    </div>

    <!-- Product Gallery -->
    <h2 style="padding-left:20px;">Trending Products</h2>

    <div class="product-gallery">

        <!-- Product A (Sale) -->
        <div class="product-card">
            <span class="label">Sale</span>
            <img src="https://images.pexels.com/photos/325876/pexels-photo-325876.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2">
            <div class="product-info">
                <h3>Product A</h3>
                <p>$49.99</p>
            </div>
        </div>

        <!-- Product B (New Arrival) -->
        <div class="product-card">
            <span class="label new">New Arrival</span>
            <img src="https://images.pexels.com/photos/298863/pexels-photo-298863.jpeg?cs=srgb&dl=pexels-solliefoto-298863.jpg&fm=jpg">
            <div class="product-info">
                <h3>Product B</h3>
                <p>$59.99</p>
            </div>
        </div>

        <!-- Product C -->
        <div class="product-card">
            <img src="https://images.pexels.com/photos/271711/pexels-photo-271711.jpeg?auto=compress&cs=tinysrgb&w=600">
            <div class="product-info">
                <h3>Product C</h3>
                <p>$39.99</p>
            </div>
        </div>

        <!-- Product D -->
        <div class="product-card">
            <img src="https://images.pexels.com/photos/1670770/pexels-photo-1670770.jpeg?auto=compress&cs=tinysrgb&w=600">
            <div class="product-info">
                <h3>Product D</h3>
                <p>$29.99</p>
            </div>
        </div>

        <!-- Product E -->
        <div class="product-card">
            <img src="https://images.pexels.com/photos/3353621/pexels-photo-3353621.jpeg?auto=compress&cs=tinysrgb&w=600">
            <div class="product-info">
                <h3>Product E</h3>
                <p>$19.99</p>
            </div>
        </div>

    </div>

    <!-- Chat Support Button -->
    <div class="chat-support">💬 Chat Support</div>

</body>
</html>
